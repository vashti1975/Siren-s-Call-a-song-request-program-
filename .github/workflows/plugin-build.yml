name: Build and publish Dalamud companions

on:
  pull_request:
    branches: [main]
    paths: ['bridge/**', 'bridge-tramatic/**', 'bridge-tests/**', 'scripts/*plugin*.py', 'scripts/prepare-release.py', '.github/workflows/plugin-build.yml']
  push:
    branches: [main]
    paths: ['bridge/**', 'bridge-tramatic/**', 'bridge-tests/**', 'scripts/*plugin*.py', 'scripts/prepare-release.py', '.github/workflows/plugin-build.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: dalamud-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned official Dalamud API 15 libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = '38d5859b17b014bfdbfbbd5d60d9433333ce330b'
          Invoke-WebRequest "https://raw.githubusercontent.com/goatcorp/dalamud-distrib/$ref/latest.zip" -OutFile "$env:RUNNER_TEMP/dalamud.zip"
          $env:DALAMUD_HOME = "$env:RUNNER_TEMP/dalamud"
          Expand-Archive "$env:RUNNER_TEMP/dalamud.zip" $env:DALAMUD_HOME
          "DALAMUD_HOME=$env:DALAMUD_HOME" >> $env:GITHUB_ENV
      - name: Test playback and announcements
        run: dotnet run --project bridge-tests/test.csproj --configuration Release
      - name: Test installer packaging
        run: python scripts/test-plugin-package.py
      - name: Build the general companion
        run: dotnet build bridge/SongbookSync.csproj --configuration Release
      - name: Build the compatible Tramatic companion
        run: dotnet build bridge-tramatic/TramaticSync.csproj --configuration Release
      - name: Validate and prepare release files
        run: python scripts/prepare-release.py --repository "${{ github.repository }}"
      - name: Retain validated build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SirensCall-Dalamud-companions
          path: |
            plugin-dist/*.zip
            plugin-dist/pluginmaster.json
            plugin-dist/SHA256SUMS.txt
            plugin-dist/release-notes.md
          if-no-files-found: error
          retention-days: 30
      - name: Publish release and installer feed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content bridge/SongbookSync.csproj)).Project.PropertyGroup.Version
          $tag = "v$version"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Increase the project versions before publishing another build." }
          gh release create $tag plugin-dist/SongbookSync.zip plugin-dist/TramaticSync.zip plugin-dist/pluginmaster.json plugin-dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Siren's Call and Tramatic Sync $version" --notes-file plugin-dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          if ($LASTEXITCODE -ne 0) { throw 'Source branch advanced incompatibly. The release is retained; update the feed from its verified asset.' }
          Copy-Item plugin-dist/pluginmaster.json pluginmaster.json -Force
          git add pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "Publish Dalamud installer feed $tag [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit the feed.' }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Could not push the feed. The verified release remains available.' }
          }
